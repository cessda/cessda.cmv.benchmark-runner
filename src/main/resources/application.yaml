# ── Server ──────────────────────────────────────────────────────────────────
server:
  port: 8080

# ── Data and results directories ─────────────────────────────────────────────
# In a Docker deployment these would typically be absolute paths to
# mounted volumes (e.g. /data, /results). For local development they
# are relative paths under the project root.
# benchmark.data-dir    - root directory for per-tenant guids_*.txt
#                         files, resolved as {data-dir}/{tenant-id}/
# benchmark.results-dir - root directory for per-tenant JSON result
#                         files and summary.json, resolved as
#                         {results-dir}/{tenant-id}/
#
# ── Benchmark Algorithm ───────────────────────────────────────────────────────
# benchmark.algorithm - URI of the Benchmark Assessment Algorithm to use
# benchmark.runner    - URI of the instance of FAIR Champion to run
# benchmark.backoff-between-process-guid-ms - pause (ms) observed before
#                         submitting each GUID after the first within a
#                         batch, to ease the burst of concurrent requests
#                         FAIR Champion otherwise sees. Leave unset to use
#                         RunBenchmarkAssessment's compiled-in default.
benchmark:
  data-dir: ./guids
  results-dir: ./results
  algorithm: https://docs.google.com/spreadsheets/d/1Nk0vM4yBpVQTo_UbB62NY_fz93aRZRHBZGh5fG-khOw
  runner: https://tools.ostrails.eu/champion/assess/algorithm
  backoff-between-process-guid-ms: 1500

# ── SpringDoc / Swagger UI ────────────────────────────────────────────────────
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /api-docs/ui
    operationsSorter: alpha
  info:
    title: CESSDA FAIR Benchmark Runner API
    description: REST API for the CESSDA CMV FAIR benchmark pipeline
    version: 2.0.0

# ── Static resources (HTML dashboard) ────────────────────────────────────────
# Spring Boot serves src/main/resources/static/ at / by default.
# This covers index.html and detail.html.
# The /results/** URL prefix is mapped to the results volume by WebConfig.java,
# matching the relative fetch() paths used in the dashboard JavaScript.
spring:
  web:
    resources:
      static-locations: classpath:/static/

# ── Logging ───────────────────────────────────────────────────────────────────
logging:
  level:
    cessda.cmv.benchmark: INFO

# ── Multi-tenancy ─────────────────────────────────────────────────────────────
tenants:
  enabled: true
  keys:
    "key-cessda": "cessda"
    "key-oxford": "oxford"
    
  # Each tenant has its own Benchmark Assessment Algorithm and FAIR
  # Champion runner — these are not shared across tenants, since one
  # tenant's algorithm configuration is not meaningful for another
  # tenant's data.
