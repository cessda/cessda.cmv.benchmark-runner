# ── Server ──────────────────────────────────────────────────────────────────
server:
  port: 8080

# ── Data and results directories ─────────────────────────────────────────────
# In a Docker deployment these would typically be absolute paths to
# mounted volumes (e.g. /data, /results). For local development they
# are relative paths under the project root.
# benchmark.data-dir    - root directory for per-tenant guids_*.txt
#                         files, resolved as {data-dir}/{tenant-id}/
# benchmark.results-dir - root directory for per-tenant JSON result
#                         files and summary.json, resolved as
#                         {results-dir}/{tenant-id}/
#
# ── Benchmark Algorithm ───────────────────────────────────────────────────────
# benchmark.algorithm - URI of the Benchmark Assessment Algorithm to use
# benchmark.runner    - URI of the instance of FAIR Champion to run
# benchmark.backoff-between-process-guid-ms - pause (ms) observed before
#                         submitting each GUID after the first within a
#                         batch, to ease the burst of concurrent requests
#                         FAIR Champion otherwise sees. Leave unset to use
#                         RunBenchmarkAssessment's compiled-in default.
benchmark:
  data-dir: ./guids
  results-dir: ./results
  algorithm: https://docs.google.com/spreadsheets/d/1Nk0vM4yBpVQTo_UbB62NY_fz93aRZRHBZGh5fG-khOw
  runner: https://tools.ostrails.eu/champion/assess/algorithm
  backoff-between-process-guid-ms: 1500

# ── SpringDoc / Swagger UI ────────────────────────────────────────────────────
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /api-docs/ui
    operationsSorter: alpha
  info:
    title: CESSDA FAIR Benchmark Runner API
    description: REST API for the CESSDA CMV FAIR benchmark pipeline
    version: 2.0.0

# ── Static resources (HTML dashboard) ────────────────────────────────────────
# Spring Boot serves src/main/resources/static/ at / by default.
# This covers index.html and detail.html.
# The /results/** URL prefix is mapped to the results volume by WebConfig.java,
# matching the relative fetch() paths used in the dashboard JavaScript.
spring:
  web:
    resources:
      static-locations: classpath:/static/

# ── Logging ───────────────────────────────────────────────────────────────────
logging:
  level:
    cessda.cmv.benchmark: INFO

# ── Multi-tenancy ─────────────────────────────────────────────────────────────
tenants:
  enabled: true
  keys:
    "key-cessda": "cessda"
    "key-oxford": "oxford"
    
  # Each tenant has its own Benchmark Assessment Algorithm and FAIR
  # Champion runner — these are not shared across tenants, since one
  # tenant's algorithm configuration is not meaningful for another
  # tenant's data.
  config:
    cessda:
      algorithm: https://docs.google.com/spreadsheets/d/1Nk0vM4yBpVQTo_UbB62NY_fz93aRZRHBZGh5fG-khOw
      runner: https://tools.ostrails.eu/champion/assess/algorithm
      oai-pmh-base-url: https://datacatalogue.cessda.eu/oai-pmh/v0/oai
      title: CESSDA Data Catalogue · Assessment Results
      footer: CESSDA FAIR Benchmark Dashboard
      set-names:
        de: German
        el: Greek
        en: English
        fi: Finnish
        fr: French
        hr: Croatian
        nl: Dutch
        sl: Slovenian
        sl-SI: Slovenian (SI)
        sv: Swedish
      fair-map:
        F1_PID: F
        F1_GUID: F
        F2A: F
        F2B: F
        F4: F
        A1_1: A
        A1_2: A
        I1_A: I
        I2_A: I
        R1_2_CPI: R
        R1_3_CEK: R
        R1_3_CTV: R
        R1_3_DMOCV: R
        R1_3_DAUV: R
        R1_3_DTMV: R
        R1_3_DSPV: R
      maturity-levels:
        level1:
          - F1_GUID
          - F2B
          - F4
          - A1_1
        level2:
          - F1_GUID
          - F2B
          - F4
          - A1_1
          - F2A
          - I1_A
          - R1_2_CPI
        level3:
          - F1_GUID
          - F2B
          - F4
          - A1_1
          - F2A
          - I1_A
          - R1_2_CPI
          - F1_PID
          - I2_A
          - R1_3_CEK
          - R1_3_CTV
          - R1_3_DMOCV
          - R1_3_DAUV
          - R1_3_DTMV
          - R1_3_DSPV
    oxford:
      algorithm: https://docs.google.com/spreadsheets/d/1Lbo0KzlN-RPRJ5POqHKh8YE2GXSv0bnaKZzwkaCOP9M
      runner: https://champion.fairsharing.org/champion/assess/algorithm
      # Placeholder — replace with Oxford's real OAI-PMH endpoint. Its
      # setSpec scheme need not match CESSDA's "language:<code>" at
      # all: the "Fetch identifiers" page discovers whatever sets a
      # tenant's own endpoint reports via ListSets, rather than
      # assuming any particular scheme.
      oai-pmh-base-url: https://oxford.example.org/oai-pmh/v0/oai
      title: Oxford Research Archive · Assessment Results
      footer: Oxford FAIR Benchmark Dashboard
      set-names:
        bhf: British Heart Foundation
        epsrc: Engineering and Physical Sciences Research Council
        mrc: Medical Research Council
        nerc: Natural Environment Research Council
        wellcome: Wellcome Trust
      # Oxford's Benchmark Assessment Algorithm scores by FAIR category
      # rather than by a fixed test checklist -- see maturity-levels
      # below. This map is derived directly from the four category
      # formulas Oxford supplied (each test's prefix -- ft_f/ft_a/ft_i/
      # ft_r -- states its own category), so it covers exactly the 25
      # tests those formulas reference, plus any extra FAIR tests
      # Oxford runs that aren't part of a maturity-level formula yet
      # (e.g. ft_i3_m_versioned_records, kept here for possible future
      # use). Extra entries like that simply don't affect maturity-level
      # scoring, which only sums the categoryMax'd categories below --
      # they only feed the dashboard's per-category pass/fail stats.
      fair-map:
        ft_f1_m_metadata_id_unique: F
        ft_f1_m_metadata_id_resolvable: F
        ft_f1_m_metadata_id_persistent: F
        ft_f2_m_discoveryfields: F
        ft_f2_m_discoverytags: F
        ft_f2_m_discoverypublisher: F
        ft_f3_m_meta_ident: F
        ft_f3_m_data_ident: F
        ft_f4_m_meta_indexed: F
        ft_a1_1_m_https_retrieval_protocol: A
        ft_a1_2_m_retrieval_protocol_supports_auth: A
        ft_a2_m_dbpersistencepolicy: A
        ft_i1_m_db_knowledge_semantic: I
        ft_i2_m_vocab_url: I
        ft_i3_m_reference_research_objects: I
        ft_i3_m_versioned_records: I
        ft_r1_1_m_database_level_licenses: R
        ft_r1_1_m_std_lic: R
        ft_r1_2_m_original_source: R
        ft_r1_2_m_creator_orcid: R
        ft_r1_2_m_funding_defined_in_metadata: R
        ft_r1_2_m_ror_id_for_funder: R
        ft_r1_2_m_author_affiliation_in_metadata: R
        ft_r1_2_m_linked_publications: R
        ft_r1_3_m_recognised_structured_metadata: R
        ft_r1_3_m_uses_iso639_language: R
      # Oxford's model: average, across F/A/I/R, of (category's earned
      # test weight / categoryMax) * 100 -- matching the Benchmark
      # Assessment Algorithm spreadsheet formulas Oxford supplied.
      # level1 >= 25%, level2 >= 50%, level3 == 100% (a perfect score
      # across all four categories; expressed as a threshold since the
      # average can never exceed 100).
      maturity-levels:
        method: weighted-score
        category-max:
          F: 32
          A: 14
          I: 13
          R: 36
        level1-threshold: 25
        level2-threshold: 50
        level3-threshold: 100